# This file was generated from a template. Edit it to match your keyboard.
# See https://zmk.dev/docs/development/hardware-integration/new-shield for more
# instructions.

# This file will be copied into the user's config directory when they add this
# keyboard. Define any Kconfig options users may frequently want to set here,
# but leave them commented out, for example:

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
CONFIG_ZMK_DISPLAY=y

########## MY CHANGES ###########

# Use BLE to communicate between split keyboard halves
CONFIG_ZMK_SPLIT_BLE=y 

# Number of peripherals that will connect to the central 
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1 

# Enable fetching split peripheral battery levels to the central side
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y 

# Enable central reporting of split battery levels to hosts
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable USB drivers
CONFIG_USB=y

# Enable Bluetooth support
CONFIG_BT=y

# Enable Bluetooth BAS (battery reporting service)
CONFIG_BT_BAS=y

# Enable ZMK as a Bluetooth Keyboard
CONFIG_ZMK_BLE=y
